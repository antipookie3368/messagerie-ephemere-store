<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EphemR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>EphemR</h1>
  <a href="/admin.html" class="admin-link">Admin</a>
</header>

<main>

  <section id="create-view" class="view">
    <p class="hint">
      Choisis un pseudo. Une discussion privée avec un admin te sera
      attribuée automatiquement, valable 24h dans ce navigateur.
    </p>
    <form id="create-form">
      <label for="pseudo-input">Pseudo</label>
      <input id="pseudo-input" autocomplete="off" placeholder="3 à 24 caractères" required>
      <button type="submit" id="create-submit">Entrer</button>
      <p class="error" id="create-error"></p>
    </form>
  </section>

  <section id="ticket-view" class="view hidden">
    <div class="ticket-meta">
      <span id="ticket-pseudo"></span>
      <span id="ticket-expiry"></span>
    </div>
    <p class="status-line" id="connection-status"></p>
    <div id="message-log"></div>
    <form id="send-form">
      <input id="message-input" autocomplete="off" placeholder="Message..." required>
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <section id="expired-view" class="view hidden">
    <p class="hint" id="expired-message">Cette discussion a expiré (24h écoulées) et a été supprimée.</p>
    <button type="button" id="restart-button">Démarrer une nouvelle discussion</button>
  </section>

</main>

<script src="/vendor/sodium.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
